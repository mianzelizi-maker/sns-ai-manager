<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | SNS AI運用システム</title>
  <style>
    :root { --bg:#f5f6f3; --surface:#fff; --ink:#1b2321; --ink-muted:#5b655f; --accent:#2e6e63; --border:#dbe1da; --border-strong:#b9c4bc; --error:#b5702c; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
    form { width:min(360px, calc(100% - 32px)); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:28px; }
    h1 { font-size:18px; margin:0 0 20px; }
    label { display:block; font-size:12.5px; color:var(--ink-muted); margin-bottom:14px; }
    input { display:block; width:100%; margin-top:6px; padding:9px 10px; font-size:14px; border:1px solid var(--border-strong); border-radius:5px; }
    button { width:100%; margin-top:6px; padding:10px; font-size:14px; font-weight:700; color:#fff; background:var(--accent); border:0; border-radius:5px; cursor:pointer; }
    .error { color:var(--error); font-size:13px; margin:0 0 14px; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>SNS AI運用システム</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label>ユーザー名<input name="username" autocomplete="username" required autofocus></label>
    <label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">ログイン</button>
  </form>
</body>
</html>
